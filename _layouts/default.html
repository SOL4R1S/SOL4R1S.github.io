<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#000000">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  {% if page.hreflang_en %}
  <link rel="alternate" hreflang="en" href="{{ page.hreflang_en }}">
  {% endif %}
  {% if page.hreflang_ko %}
  <link rel="alternate" hreflang="ko" href="{{ page.hreflang_ko }}">
  {% endif %}
  {% if page.canonical %}
  <link rel="canonical" href="{{ page.canonical }}">
  {% endif %}
</head>
<body{% if page.font_plan_b %} class="font-plan-b"{% endif %}>

  {% include nav.html %}
  {% include mobile-nav.html %}

  {% if page.sub_nav %}
    {% include sub-nav.html %}
  {% endif %}

  {{ content }}

  {% include footer.html %}
  {% include scripts.html %}

</body>
</html>
